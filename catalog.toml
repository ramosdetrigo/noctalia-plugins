[[plugin]]
id = "jubii/timer"
name = "Timer"
version = "1.0.0"
author = "jubii"
dependencies = ["libpulse"]
license = "MIT"
icon = "clock"
description = "A timer + stopwatch desktop widget with start/pause, reset, and timer adjustment buttons."
tags = ["timer", "desktop", "productivity"]
plugin_api = 3

[[plugin]]
id = "jubii/color-picker"
name = "Color Picker"
version = "1.0.0"
author = "jubii"
dependencies = ["hyprpicker"]
license = "MIT"
icon = "color-picker"
description = "Color picker bar widget - supports multiple color formats. Depends on hyprpicker."
tags = ["tool", "productivity"]
plugin_api = 3

[[plugin]]
id = "jubii/godot-provider"
name = "Godot Provider"
version = "1.0.0"
author = "jubii"
dependencies = ["godot"]
license = "MIT"
